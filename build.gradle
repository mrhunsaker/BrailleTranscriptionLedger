plugins {
    id 'java'
    id 'application'
}

group = 'com.example'
version = '2025.7.01'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.h2database:h2:2.2.224'
    implementation 'com.formdev:flatlaf:3.5.1'
    implementation 'com.formdev:flatlaf-intellij-themes:3.5.1'
    implementation 'com.itextpdf:itextpdf:5.5.13.4'
    implementation 'org.json:json:20240303'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'ch.qos.logback:logback-classic:1.5.7'
    implementation 'ch.qos.logback:logback-core:1.5.7'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'commons-io:commons-io:2.19.0'
}

application {
    mainClass = 'BrailleTranscriptionLedger.LedgerGUI'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(
            'Main-Class': 'BrailleTranscriptionLedger.LedgerGUI'
        )
    }
}

task fatJar(type: Jar) {
    archiveBaseName = 'BrailleTranscriptionLedger-all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'BrailleTranscriptionLedger.LedgerGUI'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}
