help_text=<html><h2>Keyboard Shortcuts</h2><ul><li><b>Ctrl + .</b>: Open this help menu</li><li><b>Ctrl + Enter</b>: Submit Form</li><li><b>Ctrl + G</b>: Generate PDF</li><li><b>Tab</b>: Move to Next Field</li><li><b>Shift + Tab</b>: Move to Previous Field</li><li><b>Arrow Keys</b>: Navigate Table/Dropdowns</li><li><b>Spacebar/Enter</b>: Activate Button/Checkbox</li><li><b>Alt</b>: Focus Menu Bar</li><li><b>Esc</b>: Close Dialog</li></ul><br><b>All interactive elements are keyboard accessible.</b></html>
