# Help text for the School field
school_help=Enter the name of the school or educational institution associated with this transcription. This helps identify the source or context for the record.

# Help text for the Proof Status field
proof_status_help=Select the current proof status for the project. Options include 'no proof', 'in progress', or 'complete'.

# Help text for the Project Name field
project_name_help=Choose the name of the project from the dropdown list. This identifies which project the record belongs to.

# Help text for the Element of Project field
project_element_help=Select the specific element or component of the project being tracked.

# Help text for the Project Time field
project_time_help=Enter the amount of time spent on this project element in HH:MM format.

# Help text for the Updated field
updated_help=Enter the date this record was last updated. Use the format YYYY-MM-DD. This helps track changes and ensures the information is current.

# Help text for the Complete field
complete_help=Check this box if the project or task is finished. This indicates completion status for tracking and reporting purposes.
