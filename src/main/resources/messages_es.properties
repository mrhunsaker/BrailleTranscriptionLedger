# Texto de ayuda para el campo Escuela
school_help=Ingrese el nombre de la escuela o institución educativa asociada con esta transcripción. Esto ayuda a identificar la fuente o el contexto del registro.

# Texto de ayuda para el campo Estado de Prueba
proof_status_help=Seleccione el estado actual de la prueba para el proyecto. Las opciones incluyen 'sin prueba', 'en progreso' o 'completo'.

# Texto de ayuda para el campo Nombre del Proyecto
project_name_help=Elija el nombre del proyecto de la lista desplegable. Esto identifica a qué proyecto pertenece el registro.

# Texto de ayuda para el campo Elemento del Proyecto
project_element_help=Seleccione el elemento o componente específico del proyecto que se está rastreando.

# Texto de ayuda para el campo Tiempo del Proyecto
project_time_help=Ingrese la cantidad de tiempo dedicado a este elemento del proyecto en formato HH:MM.

# Texto de ayuda para el campo Actualizado
updated_help=Ingrese la fecha en que se actualizó este registro. Use el formato AAAA-MM-DD. Esto indica la última vez que se modificó la información.

# Texto de ayuda para el campo Completo
complete_help=Marque esta casilla si el proyecto o tarea está terminado. Esto ayuda a identificar los registros que ya no requieren acción.
